# Exact versions used for every run in runs/ (versions are also recorded in each runs/*/config.json).
#   conda env create -f environment.yml
#   conda activate resnet
# PyTorch comes from the official CUDA 12.6 wheel index. The NVIDIA driver must support CUDA 12.6
# (check "CUDA Version" in nvidia-smi).
name: resnet
channels:
  - conda-forge
dependencies:
  - python=3.11.17
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - torchvision==0.29.1+cu126
      - numpy==2.4.6
      - matplotlib==3.11.2
